<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cash Reconciliation Portal</title>

    <link rel="stylesheet" href="PlugIns/Bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="PlugIns/DataTables/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="PlugIns/SweetAlert2/sweetalert2.min.css">
    <link rel="stylesheet" href="PlugIns/DataTables/buttons.bootstrap5.min.css" />

    <link rel="stylesheet" href="Styles/site.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1" id="lblDashboardTitle">Cash Reconciliation Portal</span>

            <select id="languageSelector" class="form-select form-select-sm w-auto">
                <option value="es">Español</option>
                <option value="en">English</option>
            </select>
        </div>
    </nav>

    <main class="container">

        <div class="row mb-4 text-center">
            <div class="col-md-2">
                <div class="card border-warning shadow-sm">
                    <div class="card-body p-2">
                        <small class="text-muted fw-bold" id="lblMetricPending">Pendientes</small>
                        <h5 class="mb-0 text-warning" id="valPending">0</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card border-success shadow-sm">
                    <div class="card-body p-2">
                        <small class="text-muted fw-bold" id="lblMetricReconciled">Conciliados</small>
                        <h5 class="mb-0 text-success" id="valReconciled">0</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card border-danger shadow-sm">
                    <div class="card-body p-2">
                        <small class="text-muted fw-bold" id="lblMetricShortages">Faltantes</small>
                        <h5 class="mb-0 text-danger" id="valShortages">0</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card border-info shadow-sm">
                    <div class="card-body p-2">
                        <small class="text-muted fw-bold" id="lblMetricOverages">Sobrantes</small>
                        <h5 class="mb-0 text-info" id="valOverages">0</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card border-secondary shadow-sm">
                    <div class="card-body p-2">
                        <small class="text-muted fw-bold" id="lblMetricExpected">Monto Esperado</small>
                        <h5 class="mb-0" id="valExpected">$0.00</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="card border-primary shadow-sm">
                    <div class="card-body p-2">
                        <small class="text-muted fw-bold" id="lblMetricActual">Monto Real</small>
                        <h5 class="mb-0 text-primary" id="valActual">$0.00</h5>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-end mb-3">
            <button id="btnNewDeposit" class="btn btn-primary">New Deposit</button>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table id="depositsTable" class="table table-striped table-hover" style="width:100%">
                    <thead class="table-dark">
                        <tr>
                            <th id="thDepositNumber">Deposit Number</th>
                            <th id="thExpectedAmount">Expected Amount</th>
                            <th id="thActualAmount">Actual Amount</th>
                            <th id="thStatus">Status</th>
                            <th id="thActions">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="PlugIns/jQuery/jquery.min.js"></script>
    <script src="PlugIns/Bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="PlugIns/DataTables/jquery.dataTables.min.js"></script>
    <script src="PlugIns/DataTables/dataTables.bootstrap5.min.js"></script>
    <script src="PlugIns/SweetAlert2/sweetalert2.all.min.js"></script>
    <script src="PlugIns/DataTables/js/dataTables.buttons.min.js"></script>
    <script src="PlugIns/DataTables/js/buttons.html5.min.js"></script>

    <script src="Scripts/site.js"></script>
</body>
</html>
